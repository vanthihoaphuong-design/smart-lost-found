{% extends "base.html" %}

{% block title %}
Báo nhặt được đồ
{% endblock %}

{% block content %}

<h2 class="mb-4 text-success">
📦 Báo nhặt được đồ
</h2>

<form action="/found" method="POST" enctype="multipart/form-data">

    <div class="row">
        <div class="col-md-6">
            <label class="form-label">Tên đồ</label>
            <input 
                type="text" 
                name="ten_do" 
                class="form-control" 
                placeholder="Ví dụ: Áo khoác đồng phục, Laptop Dell..." 
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Loại đồ</label>
            <select name="loai_do" class="form-select" required>
                <option value="">-- Chọn loại đồ --</option>
                <option value="Sách vở / Dụng cụ học tập">Sách vở / Dụng cụ học tập</option>
                <option value="Thiết bị điện tử (Laptop, Điện thoại...)">Thiết bị điện tử (Laptop, Điện thoại...)</option>
                <option value="Trang phục / Phụ kiện (Áo khoác, Ví...)">Trang phục / Phụ kiện (Áo khoác, Ví...)</option>
                <option value="Giấy tờ / Thẻ học sinh">Giấy tờ / Thẻ học sinh</option>
                <option value="Khác">Khác</option>
            </select>
        </div>
    </div>

    <br>

    <div class="row">
        <div class="col-md-6">
            <label class="form-label">Màu sắc</label>
            <input 
                type="text" 
                name="mau_sac" 
                class="form-control" 
                placeholder="Ví dụ: Đen, Xanh, Trắng..." 
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Nơi đang gửi đồ / Liên hệ người nhặt</label>
            <input 
                type="text" 
                name="noi_luu_giu" 
                id="noiLuuGiuInput"
                list="storageSuggestions"
                class="form-control" 
                placeholder="Phòng Bảo vệ, Phòng Đoàn - Đội, hoặc Tên + Lớp..." 
                required>
            <datalist id="storageSuggestions">
                <option value="Phòng Bảo vệ">
                <option value="Phòng Đoàn - Đội">
            </datalist>
            <div class="mt-2 d-flex flex-wrap gap-2">
                <small class="text-muted align-self-center">Chọn nhanh:</small>
                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill" onclick="document.getElementById('noiLuuGiuInput').value='Phòng Bảo vệ'">
                    🛡️ Phòng Bảo vệ
                </button>
                <button type="button" class="btn btn-sm btn-outline-success rounded-pill" onclick="document.getElementById('noiLuuGiuInput').value='Phòng Đoàn - Đội'">
                    🚩 Phòng Đoàn - Đội
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" onclick="let el=document.getElementById('noiLuuGiuInput'); el.value=''; el.focus();">
                    ✍️ Nhập tên người giữ
                </button>
            </div>
        </div>
    </div>

    <br>

    <label class="form-label">Nơi nhặt</label>
    <select name="noi_nhat" class="form-select" required>
        <option value="">-- Chọn nơi nhặt --</option>
        <option>Sân trường</option>
        <option>Nhà xe</option>
        <option>Căn tin</option>
        <option>Thư viện</option>
        <option>Sân bóng</option>

        <option>Phòng STEM</option>
        <option>Phòng Tin học 1</option>
        <option>Phòng Tin học 2</option>

        <option>Phòng Văn</option>
        <option>Phòng Sử - Địa</option>
        <option>Phòng Hội trường</option>
        <option>Phòng Đoàn - Đội</option>
        <option>Khu Văn phòng</option>
        <option>Phòng Tâm lý</option>

        <option>6A1</option><option>6A2</option><option>6A3</option>
        <option>7A1</option><option>7A2</option><option>7A3</option>
        <option>8A1</option><option>8A2</option><option>8A3</option>
        <option>9A1</option><option>9A2</option><option>9A3</option>
        <option>10A1</option><option>10A2</option><option>10A3</option>
        <option>11A1</option><option>11A2</option>
        <option>12A1</option><option>12A2</option>
    </select>

    <br>

    <div>
        <label class="form-label fw-semibold">🔍 Dấu hiệu nhận dạng riêng <span class="text-muted fw-normal">(Giúp trả đúng chủ nhân khi có nhiều đồ giống nhau)</span></label>
        <textarea 
            name="mo_ta" 
            class="form-control" 
            rows="2" 
            placeholder="Ví dụ: Mác cổ ghi tên Minh, khóa kéo bị kẹt, tay áo có vết mực, móc khóa gấu bông..."></textarea>
        <small class="text-muted">💡 Quan sát tem mác, tên ghi trên đồ, vết xước hoặc phụ kiện đi kèm để nhập vào đây.</small>
    </div>

    <br>

    <div class="row">
        <div class="col-md-6">
            <label class="form-label">Ngày nhặt</label>
            <input type="date" name="ngay_nhat" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Ảnh đồ vật (Có thể chọn tối đa 3 ảnh: mặt trước, mặt sau, chi tiết)</label>
            <input 
                type="file" 
                name="hinh_anh" 
                class="form-control" 
                accept="image/*" 
                multiple
                id="previewImage">
            <small class="text-muted d-block mt-1">💡 Chọn tối đa 3 ảnh để AI nhận diện chuẩn xác hơn.</small>

            <div class="mt-2 d-flex align-items-center gap-2 flex-wrap">
                <button type="button" id="btnAiAutoFill" class="btn btn-sm btn-outline-success rounded-pill px-3 fw-semibold" onclick="runAiAutoFill()">
                    ✨ AI tự nhận diện màu & loại đồ từ ảnh
                </button>
                <span id="aiAutoFillStatus" class="small text-muted"></span>
            </div>
        </div>
    </div>

    <br>

    <div id="multiImgPreview" class="d-flex justify-content-center flex-wrap gap-3"></div>

    <br>

    <div class="text-center">
        <button type="submit" class="btn btn-success btn-lg">
            💾 Lưu thông tin
        </button>
        <a href="/found-list" class="btn btn-secondary btn-lg">
            📋 Danh sách
        </a>
    </div>

</form>

<script>
const imageInput = document.getElementById("previewImage");
const previewContainer = document.getElementById("multiImgPreview");

if (imageInput) {
    imageInput.addEventListener("change", function(){
        previewContainer.innerHTML = "";
        const files = Array.from(this.files);
        if (files.length > 3) {
            alert("⚠️ Hệ thống chỉ hỗ trợ tối đa 3 ảnh (mặt trước, mặt sau, chi tiết). Hệ thống sẽ lấy 3 ảnh đầu tiên!");
        }
        files.slice(0, 3).forEach((file, idx) => {
            const wrapper = document.createElement("div");
            wrapper.className = "text-center";
            const img = document.createElement("img");
            img.src = URL.createObjectURL(file);
            img.style.cssText = "width:140px;height:140px;object-fit:cover;border-radius:12px;border:1px solid #ddd;padding:4px;";
            const label = document.createElement("div");
            label.className = "small text-muted mt-1 fw-bold";
            label.innerText = `Ảnh ${idx + 1}`;
            wrapper.appendChild(img);
            wrapper.appendChild(label);
            previewContainer.appendChild(wrapper);
        });
    });
}

async function runAiAutoFill() {
    const fileInput = document.getElementById("previewImage");
    const statusEl = document.getElementById("aiAutoFillStatus");
    const btn = document.getElementById("btnAiAutoFill");

    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        statusEl.innerHTML = '<span class="text-danger">⚠️ Vui lòng chọn ít nhất 1 ảnh trước!</span>';
        return;
    }

    btn.disabled = true;
    statusEl.innerHTML = '<span class="text-success">⏳ AI MobileNetV2 đang phân tích ảnh...</span>';

    const formData = new FormData();
    formData.append("image", fileInput.files[0]);

    try {
        const res = await fetch("/api/analyze-image", { method: "POST", body: formData });
        const data = await res.json();
        if (data.ok) {
            const colorInput = document.querySelector('input[name="mau_sac"]');
            const catSelect = document.querySelector('select[name="loai_do"]');
            let msgParts = [];

            if (data.colors && colorInput) {
                colorInput.value = data.colors;
                msgParts.push(`Màu: <b>${data.colors}</b>`);
            }
            if (data.category && catSelect) {
                catSelect.value = data.category;
                msgParts.push(`Loại: <b>${data.category}</b>`);
            }

            statusEl.innerHTML = msgParts.length
                ? `<span class="text-success">✅ Gợi ý: ${msgParts.join(" | ")} (Có thể sửa lại nếu chưa khớp)</span>`
                : '<span class="text-warning">🤔 AI chưa nhận diện rõ, bạn hãy nhập thủ công nhé!</span>';
        } else {
            statusEl.innerHTML = '<span class="text-danger">❌ Không thể phân tích ảnh này.</span>';
        }
    } catch (err) {
        statusEl.innerHTML = '<span class="text-danger">❌ Lỗi kết nối máy chủ AI.</span>';
    } finally {
        btn.disabled = false;
    }
}
</script>

{% endblock %}
