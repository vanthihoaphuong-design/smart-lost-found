<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Smart Lost & Found System{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .navbar-custom { 
            background-color: #0d6efd; 
        }
        .navbar-custom .navbar-brand, 
        .navbar-custom .nav-link { 
            color: #ffffff !important; 
            font-weight: 500; 
        }
        .navbar-custom .nav-link:hover { 
            color: #ffca28 !important; 
        }
        .nav-link { 
            white-space: nowrap; 
            font-size: 0.9rem; 
        }
        .cursor-pointer { 
            cursor: pointer; 
            transition: transform 0.2s ease-in-out; 
        }
        .cursor-pointer:hover { 
            transform: scale(1.03); 
        }
    </style>
</head>
<body>

    <!-- NAVBAR ĐIỀU HƯỚNG ĐẦY ĐỦ CÁC NÚT BÁO CHUẨN FLASK -->
    <nav class="navbar navbar-expand-xl navbar-custom shadow-sm py-2">
        <div class="container-fluid px-3">
            <a class="navbar-brand fw-bold me-2 text-nowrap d-flex align-items-center" href="{{ url_for('home') }}">
                🤖 Smart Lost & Found
            </a>
            
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('home') }}">🏠 Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('search') }}">🔍 Tìm kiếm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('lost') }}">➕ Báo mất</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('found') }}">📥 Báo nhặt</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('list_items') }}">📋 Đồ mất</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('found_list') }}">📦 Đồ nhặt</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('match_items') }}">🤖 Đối sánh</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('dashboard') }}">📊 Thống kê</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('heatmap') }}">🗺️ Bản đồ nhiệt</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('change_pin') }}">🔑 Đổi PIN</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- NỘI DUNG CHÍNH CỦA CÁC TRANG CON -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
