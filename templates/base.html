<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Lost & Found System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #0d6efd;
        }
        .navbar-custom .navbar-brand, 
        .navbar-custom .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }
        .navbar-custom .nav-link:hover {
            color: #ffca28 !important;
        }
    </style>
</head>
<body>

    <!-- NAVBAR THẦN TỐC THEO PHƯƠNG ÁN 2 -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('index') }}">
                🤖 AI Smart Lost & Found System
            </a>
            
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('index') }}">🏠 Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('lost_form') }}">➕ Báo mất</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('found_form') }}">📥 Báo nhặt</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('list_items') }}">📋 DS Đồ mất</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('found_list') }}">📦 DS Đồ nhặt</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('match') }}">🤖 Đối sánh AI</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('dashboard') }}">📊 Thống kê</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="{{ url_for('heatmap') }}">🗺️ Bản đồ nhiệt</a>
                    </li>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a class="btn btn-warning btn-sm fw-bold rounded-pill px-3 shadow-sm" href="#">
                            🔑 Đổi PIN
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- NOI DUNG CHINH -->
    <main class="pb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
